[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sound-evidence-core"
version = "0.1.0"
description = "Sound Evidence: the registered CPSFactorial-v2 FactorialAudioCnn/FAR core"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.9.1", "torchaudio==2.9.1", "numpy==2.1.3",
  "scipy==1.15.3", "soundfile==0.14.0", "scikit-learn==1.6.1"
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
sound-evidence = "sound_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
